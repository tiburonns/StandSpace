name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate privacy manifest
        run: plutil -lint StandSpace/PrivacyInfo.xcprivacy
      - name: Run layout tests
        run: zsh Tests/run-layout-tests.sh
      - name: Build StandSpace
        run: |
          xcodebuild \
            -project StandSpace.xcodeproj \
            -target StandSpace \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
