name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release and privacy contract
        run: |
          plutil -lint StandSpace/PrivacyInfo.xcprivacy
          plutil -lint StandSpace/Info.plist
          python3 Tests/validate-release-contract.py
      - name: Run layout tests
        run: zsh Tests/run-layout-tests.sh
      - name: Run language tests
        run: zsh Tests/run-language-tests.sh
      - name: Build Release for iOS Simulator
        run: |
          xcodebuild \
            -project StandSpace.xcodeproj \
            -target StandSpace \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Build Release for iPhoneOS
        run: |
          xcodebuild \
            -project StandSpace.xcodeproj \
            -target StandSpace \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build
